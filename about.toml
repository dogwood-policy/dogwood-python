#
# cargo-about configuration for THIRD-PARTY-NOTICES, the attribution file
# shipped in every wheel and the sdist. scripts/third-party-notices.sh
# generates it.
#
# `accepted` must match deny.toml: its `allow` list plus the two single-crate
# exceptions (smartstring, MPL-2.0; tiny-keccak, CC0-1.0). cargo-deny remains
# the gate on which licenses may enter the tree; this only renders them.

accepted = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "MIT",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
]

# Every target a release wheel is built for (.github/workflows/release.yml).
# One notices file covers them all: a crate compiled in for any of them is
# listed. Build dependencies (proc macros and build scripts) stay in: their
# generated code is in the binary.
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-unknown-linux-musl",
    "aarch64-unknown-linux-musl",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
    "aarch64-pc-windows-msvc",
]
ignore-dev-dependencies = true
ignore-build-dependencies = false

# dogwood-python itself (publish = false) is first-party: its LICENSE and
# NOTICE ship in the package separately.
private = { ignore = true }
