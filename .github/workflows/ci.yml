name: ci

# Builds the extension from the committed lockfiles, runs the test suite, and
# audits the Rust and Python dependencies. Required to pass before merging to
# main.
#
# Every third-party action is pinned by commit SHA; Dependabot keeps the pins
# (and the version comments) current.
on:
  push:
    branches: [main]
  pull_request:
  # New advisories land against unchanged code; re-audit daily.
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

# `github.workflow` is the caller's name when release.yml calls this file, so
# a release run's CI never shares a group with (and is never replaced by) a
# push's CI on the same ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Installs the toolchain pinned in rust-toolchain.toml.
      - run: rustup toolchain install

      # Runs the build and test tools. The oldest supported CPython (3.9) is
      # smoke-tested in a container below: setup-python has no 3.9 build for
      # current runner images, and pytest no longer supports 3.9.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      # Hash-pinned build and test tools (ci/requirements.txt).
      - run: |
          python -m venv "$RUNNER_TEMP/tools"
          "$RUNNER_TEMP/tools/bin/pip" install --require-hashes -r ci/requirements.txt

      # `--locked` fails the build rather than silently re-resolving if
      # Cargo.lock is out of date.
      - run: cargo build --locked --workspace

      # THIRD-PARTY-NOTICES ships in every wheel. Generating it on every
      # change means a dependency update with an unreadable or unaccepted
      # license fails here, not at release time.
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-about@0.9.3
      # cargo-about runs offline over every release target; `cargo build`
      # only downloaded the host's crates.
      - run: cargo fetch --locked
      - run: scripts/third-party-notices.sh THIRD-PARTY-NOTICES

      - name: Build the abi3 wheel
        run: '"$RUNNER_TEMP/tools/bin/maturin" build --release --out "$RUNNER_TEMP/dist"'

      # Run from outside the source tree so the tests import the installed
      # wheel, not crates/dogwood-python/python.
      - name: Test the wheel (CPython 3.13)
        working-directory: ${{ runner.temp }}
        run: |
          "$RUNNER_TEMP/tools/bin/pip" install --no-index --find-links "$RUNNER_TEMP/dist" dogwood-aws
          "$RUNNER_TEMP/tools/bin/python" -m pytest "$GITHUB_WORKSPACE/crates/dogwood-python/tests"

      # The same abi3 wheel must load on the oldest supported CPython. The
      # image is pinned by digest (python:3.9.25-slim, the final 3.9 release)
      # and runs without network access.
      - name: Smoke-test the wheel (CPython 3.9)
        run: |
          docker run --rm --network none \
            -v "$RUNNER_TEMP/dist:/dist:ro" \
            -v "$GITHUB_WORKSPACE/crates/dogwood-python/examples:/examples:ro" \
            python:3.9-slim@sha256:2d97f6910b16bd338d3060f261f53f144965f755599aab1acda1e13cf1731b1b \
            sh -euc 'pip install --root-user-action=ignore --no-index --find-links /dist dogwood-aws && python /examples/demo.py'

  cargo-deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # cargo-deny reads the dependency graph via `cargo metadata`, so it needs
      # the toolchain pinned in rust-toolchain.toml. Install it explicitly
      # rather than relying on rustup's auto-install.
      - run: rustup toolchain install

      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-deny@0.20.2

      # Advisories (RustSec), licenses, banned crates and allowed sources;
      # policy in deny.toml.
      - run: cargo deny --locked check

  # The Python counterpart of dogwood-wasm's npm-audit: the extension has no
  # Python runtime dependencies, so this audits the hash-pinned build and test
  # tools CI and the release workflow install.
  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      # One file per step: pip-audit resolves its inputs together, and the two
      # files pin different versions of shared dependencies.
      - uses: pypa/gh-action-pip-audit@1220774d901786e6f652ae159f7b6bc8fea6d266 # v1.1.0
        with:
          inputs: ci/requirements.txt
          require-hashes: true
          no-deps: true
      - uses: pypa/gh-action-pip-audit@1220774d901786e6f652ae159f7b6bc8fea6d266 # v1.1.0
        with:
          inputs: ci/test-requirements.txt
          require-hashes: true
          no-deps: true

  # Scans the full git history for committed credentials with gitleaks (MIT).
  # Complements GitHub secret scanning and push protection, which are on for
  # the repository. gitleaks-action is not used: it needs a paid licence key
  # for organization repositories. The binary is pinned by version and
  # SHA-256 (from the release's checksums.txt); Dependabot does not update
  # it, so bump both together.
  secret-scan:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          f="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$f"
          echo "$GITLEAKS_SHA256  $f" | sha256sum -c -
          tar xzf "$f" -C "$RUNNER_TEMP" gitleaks

      # Fails on any finding. --redact keeps a found secret out of the log.
      - name: Scan the git history
        run: '"$RUNNER_TEMP/gitleaks" git --log-opts="--all" --redact --no-banner -v .'
