[package]
name = "dogwood-python"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false
description = "Python bindings for the Dogwood policy frontend (validate, lower, replay, live authorization)."

[lib]
name = "_dogwood"
crate-type = ["cdylib"]

[dependencies]
# The Dogwood operations, shared with the `dogwood` CLI and the WebAssembly
# binding.
dogwood-ops = { version = "1.2", features = ["mcp-schema"] }
pyo3 = { version = "0.30", features = ["abi3-py39"] }
pythonize = "0.30"
serde = "1"
serde_json = "1"

[features]
# Don't link libpython: the interpreter loading the extension provides it. On
# by default so a plain `cargo build --workspace` links, not just maturin.
default = ["extension-module"]
extension-module = ["pyo3/extension-module"]
