[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
# The import name is `dogwood`.
name = "aws-dogwood"
# Taken from crates/dogwood-python/Cargo.toml, the single source of truth.
dynamic = ["version"]
description = "Python bindings for the Dogwood policy frontend (validate, lower, replay, live authorization)."
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
# THIRD-PARTY-NOTICES is generated by scripts/third-party-notices.sh; a
# release build fails without it (scripts/prepare-release.sh).
license-files = ["LICENSE", "NOTICE", "THIRD-PARTY-NOTICES"]
classifiers = [
  "Programming Language :: Rust",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: Implementation :: CPython",
  "Typing :: Typed",
]

[project.urls]
Repository = "https://github.com/dogwood-policy/dogwood-python"
Documentation = "https://dogwood-policy.github.io/dogwood/"

[project.optional-dependencies]
# pytest 9 needs Python 3.10, and every earlier pytest is affected by
# CVE-2025-71176 (tmpdir handling, fixed in 9.0.3). Python 3.9 is still
# supported, so it gets the last pytest that runs there.
test = [
  "pytest>=9.0.3; python_version >= '3.10'",
  "pytest>=8.4,<9; python_version < '3.10'",
]

[tool.maturin]
manifest-path = "crates/dogwood-python/Cargo.toml"
python-source = "crates/dogwood-python/python"
module-name = "dogwood._dogwood"
# Build from the committed Cargo.lock; fail rather than re-resolve.
locked = true
